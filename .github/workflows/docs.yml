name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all release tags, for build-versions.sh

      - name: Check Turtle syntax
        run: |
          pip install --quiet rdflib
          python -c "import rdflib; g = rdflib.Graph().parse('ontology/bcfOWL.ttl'); print(len(g), 'triples')"

      # Fails if the ontology changed since the last release but its version did not.
      - name: Check ontology version
        run: python scripts/check-version.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: .cache
          key: widoco-${{ hashFiles('scripts/build-docs.sh') }}
          restore-keys: widoco-

      - name: Build documentation
        run: bash scripts/build-docs.sh

      - name: Build released versions
        run: bash scripts/build-versions.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4